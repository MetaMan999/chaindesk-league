[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 10000
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 256, depth = 64, fail_on_revert = true }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
testnet = "${TESTNET_RPC_URL}"
