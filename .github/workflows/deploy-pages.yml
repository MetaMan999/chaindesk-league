name: Deploy ChainDesk League

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Validate web application
        run: npm run lint && npm run test:web

      - name: Build application
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_CHAIN_ID: ${{ vars.VITE_CHAIN_ID }}
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL }}
          VITE_PROFILE_MINT_FEE_ETH: ${{ vars.VITE_PROFILE_MINT_FEE_ETH }}
          VITE_GAME_ADDRESS: ${{ vars.VITE_GAME_ADDRESS }}
          VITE_PROFILE_ADDRESS: ${{ vars.VITE_PROFILE_ADDRESS }}
          VITE_PAPER_ASSET_ADDRESS: ${{ vars.VITE_PAPER_ASSET_ADDRESS }}
          VITE_ACHIEVEMENT_ADDRESS: ${{ vars.VITE_ACHIEVEMENT_ADDRESS }}
          VITE_CREW_ADDRESS: ${{ vars.VITE_CREW_ADDRESS }}
          VITE_DEAL_ROOM_ADDRESS: ${{ vars.VITE_DEAL_ROOM_ADDRESS }}
          VITE_WORK_FLOOR_ADDRESS: ${{ vars.VITE_WORK_FLOOR_ADDRESS }}
          VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.VITE_WALLETCONNECT_PROJECT_ID }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
