name: Banker Bros CI

on:
  push:
    branches: [main]
    paths:
      - "banker-bros/**"
      - ".github/workflows/banker-bros-ci.yml"
  pull_request:
    paths:
      - "banker-bros/**"
      - ".github/workflows/banker-bros-ci.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: banker-bros
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge fmt --check
      - run: forge build
      - run: forge build --sizes --skip script --skip test
      - run: forge test --profile ci -vvv

  apps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: banker-bros
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: banker-bros/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @banker-bros/realtime test
      - run: pnpm typecheck
      - run: pnpm build

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: crytic/slither-action@v0.4.2
        with:
          target: banker-bros
          fail-on: high
